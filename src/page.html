<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<meta property="og:type" content="website">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="{{image}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:site_name" content="Below the Root">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{image}}">
<link rel="stylesheet" href="/site.css">
{{styles}}
</head>
<body>
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position: absolute">
  <defs>
    <path id="screen-curve" vector-effect="non-scaling-stroke" d="M .046 .008 Q .5 -.008 .954 .008 Q .987 .01 .994 .053 Q 1.006 .5 .994 .947 Q .987 .99 .954 .992 Q .5 1.008 .046 .992 Q .013 .99 .006 .947 Q -.006 .5 .006 .053 Q .013 .01 .046 .008 Z"/>
    <clipPath id="screen-outline" clipPathUnits="objectBoundingBox">
      <use href="#screen-curve"/>
    </clipPath>
  </defs>
</svg>
<header id="site-header">
<div id="navigation-controls">
{{nav}}
</div>
{{helpButton}}
{{developer}}
</header>
{{content}}
{{scripts}}
</body>
</html>
