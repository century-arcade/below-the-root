<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Below the Root</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #0b130d; color: #9ad284; font: 12px/1.6 monospace; }
  body { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  body.debugging { box-sizing: border-box; justify-content: flex-start; padding-top: 48px; }
  [hidden] { display: none !important; }
  canvas { image-rendering: pixelated; display: block; background: #000; }
  #game { display: flex; flex-direction: column; align-items: stretch; }
  #where { min-height: 32px; font-size: 24px; line-height: 32px; letter-spacing: 2px; text-align: center; }
  #game.paused canvas { filter: grayscale(1) brightness(0.5); }
  #debug {
    position: fixed; top: 0; left: 50%; z-index: 2; transform: translateX(-50%);
    box-sizing: border-box; width: min(356px, 100%); padding: 8px;
    overflow-x: auto; white-space: nowrap;
  }
  #debug-buttons {
    display: grid; grid-template-columns: repeat(2, 168px); gap: 4px;
    width: max-content; margin-inline: auto;
  }
  #debug-buttons > button, #debug-buttons > .file-label {
    box-sizing: border-box; overflow: hidden; text-align: center;
    text-overflow: ellipsis; white-space: nowrap;
  }
  #download-record { grid-column: 1; grid-row: 1; }
  #debug-buttons > .file-label { grid-column: 2; grid-row: 1; }
  #github-auth { position: fixed; top: 8px; right: 8px; z-index: 2; }
  #github-auth > button {
    box-sizing: border-box; width: 168px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  #debug-status {
    box-sizing: border-box; width: 100%; height: 1.6em; overflow: hidden; text-align: left;
    text-overflow: ellipsis; white-space: nowrap;
  }
  #game-controls { min-height: 39px; padding-top: 8px; text-align: center; }
  #game-controls > button { box-sizing: border-box; width: 168px; }
  button, .file-label { font: inherit; background: #142019; color: #b6e6a4; border: 1px solid #567; padding: 5px 9px; cursor: pointer; }
  button:focus-visible, textarea:focus-visible { outline: 2px solid #d6f897; }
  #notice { position: fixed; top: 8px; left: 8px; padding: 8px; background: #142019; max-width: 90vw; z-index: 2; }
  dialog {
    position: static; align-self: center; margin: 8px 0 0;
    background: #101910; color: #b6e6a4; border: 1px solid #567; width: min(480px, 85vw);
  }
  textarea { display: block; box-sizing: border-box; width: 100%; min-height: 108px; margin: 10px 0; background: #000; color: #d6f897; font: inherit; }
  a { color: #c7f5ae; }
  #issue-result { overflow-wrap: anywhere; }
  @media (max-width: 720px) {
    #debug { right: 184px; left: 0; width: auto; transform: none; }
    #notice { top: 48px; }
  }
</style>
</head>
<body>
<div id="notice" role="status" hidden></div>
<div id="github-auth" hidden>
  <button id="github-login">Log in to GitHub</button>
  <button id="github-logout" hidden>Log out</button>
</div>
<div id="debug" hidden>
  <div id="debug-buttons">
    <button id="download-record">Download recording</button>
    <label class="file-label">Load recording <input id="load-record" type="file" accept=".json,.prg,application/json" hidden></label>
  </div>
</div>
<div id="game">
  <div id="where" role="status"></div>
  <canvas id="screen" aria-label="Below the Root game. Arrow keys or WASD to move; space is the joystick button; Escape or P pauses."></canvas>
  <div id="debug-status" hidden></div>
  <div id="game-controls" hidden>
    <button id="file-issue" aria-keyshortcuts="R">Report Issue</button>
  </div>
  <dialog id="issue-dialog" aria-labelledby="issue-label">
    <form id="issue-form">
      <label id="issue-label" for="issue-message">What happened?</label>
      <textarea id="issue-message" required maxlength="8000" placeholder="Describe the problem…"></textarea>
      <p>The room, game state, and recent moves will be included.</p>
      <button id="issue-submit" type="submit">File issue</button>
      <button id="issue-cancel" type="button">Close</button>
      <p id="issue-result" role="status"></p>
    </form>
  </dialog>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
