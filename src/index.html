<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Below the Root</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #9ad284;
               font: 12px/1.6 monospace; }
  body { display: flex; flex-direction: column; align-items: center;
         justify-content: center; }
  canvas { image-rendering: pixelated; display: block; }
  #where { font-size: 24px; line-height: 32px; letter-spacing: 2px; }
  #status { padding: 4px; min-height: 1.6em; }
  #help { color: #567; }
</style>
</head>
<body>
<div id="where"></div>
<canvas id="screen"></canvas>
<div id="status">loading...</div>
<div id="help">arrows/wasd + space = joystick; or hold the mouse/finger to push that way, tap for the button, double-tap a spot to walk there &middot; 1-5 saves to a browser slot, shift+1-5 loads it (the same five slots as DISK STORAGE) &middot; x downloads the C64 QUEST save file; drop one on the page to load it</div>
<script type="module" src="main.js"></script>
</body>
</html>
