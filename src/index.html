<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Below the Root</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #000; color: #9ad284; font: 12px/1.6 monospace; }
  body { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  [hidden] { display: none !important; }
  canvas { image-rendering: pixelated; display: block; }
  #where { font-size: 24px; line-height: 32px; letter-spacing: 2px; min-height: 32px; }
  #debug { max-width: 960px; padding: 8px; }
  #debug-status { overflow-wrap: anywhere; }
  button, .file-label { font: inherit; background: #142019; color: #b6e6a4; border: 1px solid #567; padding: 5px 9px; cursor: pointer; }
  button:focus-visible, textarea:focus-visible { outline: 2px solid #d6f897; }
  #notice { position: fixed; top: 8px; padding: 8px; background: #142019; max-width: 90vw; z-index: 2; }
  dialog { background: #101910; color: #b6e6a4; border: 1px solid #567; width: min(480px, 85vw); }
  dialog::backdrop { background: #000a; }
  textarea { display: block; box-sizing: border-box; width: 100%; min-height: 160px; margin: 10px 0; background: #000; color: #d6f897; font: inherit; }
  a { color: #c7f5ae; }
  #issue-result { overflow-wrap: anywhere; }
</style>
</head>
<body>
<div id="notice" role="status" hidden></div>
<div id="debug" hidden>
  <button id="github-login">Log in to GitHub</button>
  <button id="github-logout" hidden>Log out</button>
  <button id="file-issue" hidden>File an issue</button>
  <button id="download-record">Download recording</button>
  <label class="file-label">Load recording <input id="load-record" type="file" accept=".json,.prg,application/json" hidden></label>
  <div id="debug-status"></div>
</div>
<div id="where"></div>
<canvas id="screen" aria-label="Below the Root game. Arrow keys or WASD to move; space is the joystick button."></canvas>
<dialog id="issue-dialog" aria-labelledby="issue-label">
  <form id="issue-form">
    <label id="issue-label" for="issue-message">What happened?</label>
    <textarea id="issue-message" required maxlength="8000" placeholder="Describe the problem…"></textarea>
    <p>The room, game state, and recent moves will be included.</p>
    <button id="issue-submit" type="submit">File issue</button>
    <button id="issue-cancel" type="button">Close</button>
    <p id="issue-result" role="status"></p>
  </form>
</dialog>
<script type="module" src="main.js"></script>
</body>
</html>
