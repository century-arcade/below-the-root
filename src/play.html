<section id="play" aria-label="Play Below the Root">
<div id="game">
  <div id="play-area">
    <p id="startup-status" role="status"><span>Loading game…</span> <a href="">Reload page</a> if it does not start.</p>
    <div id="monitor" class="unfitted" data-surround="dark">
    <div id="canvas-box">
      <canvas id="screen" width="320" height="232" tabindex="0" aria-label="Below the Root game. Arrow keys or WASD to move; Space or Enter is the joystick button; F opens the command menu or selects a choice; Up and Down browse choices once per press; Escape closes the menu or pauses; P pauses; M or Tab shows the map. Press ? for all controls."></canvas>
      <button id="command-menu" hidden aria-label="Open command menu" aria-keyshortcuts="F" title="Open command menu (F)"></button>
      <div id="crt" aria-hidden="true" hidden><div id="scanlines"></div><div id="stripes"></div></div>
      <svg id="screen-focus" hidden viewBox="0 0 1 1" preserveAspectRatio="none" aria-hidden="true" focusable="false"><use href="#screen-curve"/></svg>
    </div>
    <div id="monitor-controls" role="group" aria-label="Monitor controls">
      <button id="fullscreen" aria-label="Fullscreen" title="Fullscreen"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8V3h5M12 3h5v5M17 12v5h-5M8 17H3v-5"/></svg></button>
      <span id="music-notes" class="monitor-speaker" aria-hidden="true" title="Music"></span>
      <input id="volume" type="range" min="0" max="100" step="10" aria-label="Volume" title="Volume">
      <button id="monitor-power" type="button" aria-label="Monitor power" aria-pressed="true" title="Power off (reset game)"><span class="power-switch" aria-hidden="true"><span class="power-light"></span></span></button>
    </div>
    </div>
    <div id="map-screen" hidden role="dialog" aria-label="World map">
      <div id="map-heading">
        <h2>World map</h2>
        <div id="map-tools">
          <button id="map-zoom-out" aria-label="Zoom out" disabled>−</button>
          <output id="map-zoom" aria-live="polite">1×</output>
          <button id="map-zoom-in" aria-label="Zoom in">+</button>
        </div>
        <button id="close-map">Close</button>
      </div>
      <div id="map-viewport"><div id="map-grid"></div></div>
      <p id="map-hint">WASD / arrows to pan · Scroll to zoom · Drag to explore</p>
    </div>
    <div id="replay-controls" hidden>
      <div id="replay-navigation" role="group" aria-label="Replay room navigation">
        <button type="button" data-replay-rooms="-10" aria-label="Back ten rooms">&lt;&lt;-</button>
        <button type="button" data-replay-rooms="-1" aria-label="Back one room">&lt;-</button>
        <button id="play-from-replay" type="button">Play from here</button>
        <button type="button" data-replay-rooms="1" aria-label="Forward one room">-&gt;</button>
        <button type="button" data-replay-rooms="10" aria-label="Forward ten rooms">-&gt;&gt;</button>
      </div>
      <output id="replay-progress" aria-label="Replay room progress"></output>
    </div>
    <aside id="help-screen" hidden aria-label="Input help" tabindex="-1">
      <h2 id="help-heading">Input help</h2>
      <div id="help-content">{{help}}</div>
    </aside>
  </div>
  <div id="log" role="log" aria-live="polite" hidden></div>
  <dialog id="issue-dialog" aria-labelledby="issue-label">
    <form id="issue-form">
      <label id="issue-label" for="issue-message">What happened?</label>
      <textarea id="issue-message" required maxlength="8000" placeholder="Describe the problem…"></textarea>
      <p>The room, game state, and recent moves will be included.</p>
      <button id="issue-submit" type="submit">File issue</button>
      <button id="issue-cancel" type="button">Close</button>
      <button id="github-logout" type="button" hidden>Log out</button>
      <p id="issue-result" role="status"></p>
    </form>
  </dialog>
</div>
</section>
