<div id="desk" class="desk" aria-label="On the bench">
<div class="bench-stage">
<section id="box" data-desk="outside" aria-label="The box">
  <div class="book-spread">
    <a data-book-image href="/assets/box/front.jpg" target="_blank" rel="noopener" aria-label="Turn the box">
      <img alt="" decoding="async">
      <img src="/assets/box/front.jpg" width="454" height="599" alt="" loading="lazy" decoding="async">
    </a>
    <div class="page-turns">
      <button type="button" data-book-first aria-label="First page" aria-keyshortcuts="Home"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3l-7 7 7 7M17 3l-7 7 7 7"/></svg></button>
      <button type="button" data-book-previous aria-label="Previous page" aria-keyshortcuts="ArrowLeft"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M13 3l-7 7 7 7"/></svg></button>
      <button type="button" data-book-next aria-label="Next page" aria-keyshortcuts="ArrowRight"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 3l7 7-7 7"/></svg></button>
      <button type="button" data-book-last aria-label="Last page" aria-keyshortcuts="End"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3l7 7-7 7M10 3l7 7-7 7"/></svg></button>
    </div>
  </div>
</section>
<section id="note" data-desk="note" hidden aria-label="Curator's Note">
{{note}}
</section>
<section id="manual" data-desk="manual" hidden aria-label="Original manual">
  <div class="book-spread">
    <a data-book-image href="/assets/manual/03.webp" target="_blank" rel="noopener" aria-label="Turn the page">
      <img alt="" loading="lazy" decoding="async">
      <img src="/assets/manual/03.webp" alt="Original Below the Root manual, page 1" loading="lazy" decoding="async">
    </a>
    <div class="page-turns">
      <button type="button" data-book-first aria-label="First page" aria-keyshortcuts="Home"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3l-7 7 7 7M17 3l-7 7 7 7"/></svg></button>
      <button type="button" data-book-previous aria-label="Previous page" aria-keyshortcuts="ArrowLeft"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M13 3l-7 7 7 7"/></svg></button>
      <button type="button" data-book-next aria-label="Next page" aria-keyshortcuts="ArrowRight"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 3l7 7-7 7"/></svg></button>
      <button type="button" data-book-last aria-label="Last page" aria-keyshortcuts="End"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3l7 7-7 7M10 3l7 7-7 7"/></svg></button>
    </div>
  </div>
  <output class="page-number" aria-live="polite">Page 1 / 18</output>
</section>
<section id="dev-notes" class="book-spread" data-desk="dev-notes" hidden aria-label="Dev notes">
  <div class="greenbar-viewport" tabindex="0" role="region" aria-label="Dated development prompts">
    <div class="greenbar-paper"></div>
  </div>
  <div class="page-turns">
    <button type="button" data-paper-first aria-label="First day" aria-keyshortcuts="Home"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3l-7 7 7 7M17 3l-7 7 7 7"/></svg></button>
    <button type="button" data-paper-previous aria-label="Previous day" aria-keyshortcuts="ArrowLeft" disabled><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M13 3l-7 7 7 7"/></svg></button>
    <button type="button" data-paper-next aria-label="Next day" aria-keyshortcuts="ArrowRight"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 3l7 7-7 7"/></svg></button>
    <button type="button" data-paper-last aria-label="Last day" aria-keyshortcuts="End"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3l7 7-7 7M10 3l7 7-7 7"/></svg></button>
  </div>
</section>
<section id="paper-map" data-desk="map" hidden aria-label="World map" aria-keyshortcuts="M Tab">
  <div id="map-viewport"><div id="map-sheet" class="map-sheet"><div id="map-grid" class="map-grid"></div></div></div>
  <div id="map-tools">
    <button type="button" id="map-zoom-out" aria-label="Zoom out" disabled><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12"/></svg></button>
    <button type="button" id="map-zoom-in" aria-label="Zoom in"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12M10 4v12"/></svg></button>
  </div>
</section>
</div>
<div class="bench-strip">
  <button type="button" class="tray-item tray-note" data-desk-go="note" aria-label="Foreword"><span class="booklet-cover"><span>Century<br>Arcade</span></span></button>
  <button type="button" class="tray-item tray-closed" data-desk-go="outside" aria-label="Box"><span class="closed-box"><img src="/assets/box/front-thumb.webp" width="280" height="369" alt=""></span></button>
  <button type="button" class="tray-item tray-manual" data-desk-go="manual" aria-label="Manual"><img src="/assets/manual/03-thumb.webp" width="300" height="401" alt=""></button>
  <button type="button" class="tray-item tray-map" data-desk-go="map" aria-label="Map"><img src="/assets/box/map-thumb.webp" width="840" height="450" alt=""></button>
  <button type="button" class="tray-item tray-disk" data-desk-go="play" aria-label="Game"><svg viewBox="0 0 104 124" aria-hidden="true">

    <rect width="100" height="100" fill="#1d1c1f"/>

    <rect x="0" y="120" width="104" height="4" fill="#c9c0aa"/>
    <rect x="0" y="44" width="104" height="2" fill="#f6f2e8"/>
  </svg></button>
  <button type="button" class="tray-item tray-dev-notes" data-desk-go="dev-notes" aria-label="Prompts"><span class="greenbar-stack-sheet"><span>DEV NOTES</span></span></button>
</div>
</div>
<section id="play" aria-label="Play Below the Root">
<div id="game">
  <div id="play-area">
    <div id="monitor" class="unfitted" data-surround="commodore">
    <div id="glass-surround">
    <div id="glass">
    <div id="canvas-box">
      <canvas id="screen" width="320" height="200" tabindex="0" aria-label="Below the Root game. Arrow keys or WASD to move; Space or Enter is the joystick button; F opens the command menu or selects a choice; Up and Down browse choices once per press; Escape closes the menu or pauses; P pauses; M or Tab shows the map. Press ? for all controls."></canvas>
      <button id="command-menu" hidden aria-label="Open command menu" aria-keyshortcuts="F" title="Open command menu (F)"></button>
      <div id="crt" aria-hidden="true" hidden><div id="scanlines"></div><div id="stripes"></div></div>
    </div>
      <svg id="screen-focus" hidden viewBox="0 0 1 1" preserveAspectRatio="none" aria-hidden="true" focusable="false"><use href="#screen-curve"/></svg>
    </div>
    </div>
    <div id="monitor-sidebar">
    <div id="monitor-controls" role="group" aria-label="Monitor controls">
      <button id="fullscreen" aria-label="Fullscreen" title="Fullscreen"><svg viewBox="0 0 20 20" aria-hidden="true"><path class="enter" d="M3 8V3h5M12 3h5v5M17 12v5h-5M8 17H3v-5"/><path class="exit" d="M3 8h5V3M12 3v5h5M17 12h-5v5M8 17v-5H3"/></svg><span class="key-label" aria-hidden="true">Fullscreen</span></button>
      <span id="music-notes" class="monitor-speaker" aria-hidden="true" title="Music"></span>
      <span id="volume-panel"><svg class="volume-scale" viewBox="293.5 330 59 23" aria-hidden="true" focusable="false"><path class="ticks" d="M302 332.2V334.6M306.2 333V334.6M310.4 333V334.6M314.6 333V334.6M318.8 333V334.6M323 332.2V334.6M327.2 333V334.6M331.4 333V334.6M335.6 333V334.6M339.8 333V334.6M344 332.2V334.6"/><rect class="track" x="299.5" y="337" width="47" height="3" rx="1.5"/><rect class="slot" x="300" y="337.6" width="46" height="1.8" rx="0.9"/><text x="323" y="346.3" text-anchor="middle">VOLUME</text></svg><input id="volume" type="range" min="0" max="100" step="10" aria-label="Volume" title="Volume"></span>
      <button id="monitor-power" type="button" aria-label="Monitor power" aria-pressed="true" title="Power off (reset game)"><span class="power-switch" aria-hidden="true"></span><span class="key-label" aria-hidden="true">Power</span></button>
      <span class="power-light" aria-hidden="true"></span>
    </div>
    <div id="monitor-developer">
{{developer}}
    </div>
    </div>
    </div>
    <div id="replay-controls" hidden>
      <div id="replay-navigation" role="group" aria-label="Replay room navigation">
        <button type="button" data-replay-rooms="-10" aria-label="Back ten rooms"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 4l-6 6 6 6M14 4l-6 6 6 6M2 10h16"/></svg></button>
        <button type="button" data-replay-rooms="-1" aria-label="Back one room"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M9 4l-6 6 6 6M3 10h14"/></svg></button>
        <button id="play-from-replay" type="button">Play from here</button>
        <button type="button" data-replay-rooms="1" aria-label="Forward one room"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M11 4l6 6-6 6M3 10h14"/></svg></button>
        <button type="button" data-replay-rooms="10" aria-label="Forward ten rooms"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4l6 6-6 6M6 4l6 6-6 6M2 10h16"/></svg></button>
      </div>
      <output id="replay-progress" aria-label="Replay room progress"></output>
    </div>
    <aside id="help-screen" hidden aria-label="Input help" tabindex="-1">
      <h2 id="help-heading">Input help</h2>
      <div id="help-content">{{help}}</div>
    </aside>
  </div>
  <dialog id="issue-dialog" aria-labelledby="issue-label">
    <form id="issue-form">
      <label id="issue-label" for="issue-message">What happened?</label>
      <textarea id="issue-message" required maxlength="8000" placeholder="Describe the problem…"></textarea>
      <p>The room, game state, and recent moves will be included.</p>
      <button id="issue-submit" type="submit">File issue</button>
      <button id="issue-cancel" type="button">Close</button>
      <button id="github-logout" type="button" hidden>Log out</button>
      <p id="issue-result" role="status"></p>
    </form>
  </dialog>
</div>
</section>
<div id="touch-corner" role="group" aria-label="Touch controls">
  <button id="touch-map" type="button" aria-label="Map" title="Map"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 5l5-2 6 2 5-2v12l-5 2-6-2-5 2zM7 3v12M13 5v12"/></svg></button>
</div>
</div>
