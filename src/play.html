<section id="play" aria-label="Play Below the Root">
<div id="game">
  <div id="where" role="status"></div>
  <div id="canvas-box">
    <canvas id="screen" tabindex="0" aria-label="Below the Root game. Arrow keys or WASD to move; Space or Enter is the joystick button; Escape or P pauses; Tab shows the map. Press ? for all controls."></canvas>
    <div id="crt" aria-hidden="true" hidden><div id="scanlines"></div><div id="stripes"></div></div>
    <svg id="screen-focus" viewBox="0 0 1 1" preserveAspectRatio="none" aria-hidden="true" focusable="false"><use href="#screen-curve"/></svg>
    <div id="map-screen" hidden role="dialog" aria-label="World map">
      <div id="map-heading"><span>World map</span><button id="close-map">Close</button></div>
      <div id="map-tools">
        <button id="map-zoom-out" aria-label="Zoom out" disabled>−</button>
        <output id="map-zoom" aria-live="polite">1×</output>
        <button id="map-zoom-in" aria-label="Zoom in">+</button>
      </div>
      <div id="map-viewport"><div id="map-grid"></div></div>
    </div>
    <div id="help-screen" hidden role="dialog" aria-label="How to play" tabindex="-1">
      <div id="help-heading"><span>How to play</span><button id="close-help">Close</button></div>
      <div id="help-content">{{help}}</div>
    </div>
  </div>
  <div id="game-controls">
    <div id="basics" hidden>WASD / Arrows to move<br>Space / Enter to skip / jump / select</div>
  </div>
  <div id="log" role="log" aria-live="polite" hidden></div>
  <dialog id="issue-dialog" aria-labelledby="issue-label">
    <form id="issue-form">
      <label id="issue-label" for="issue-message">What happened?</label>
      <textarea id="issue-message" required maxlength="8000" placeholder="Describe the problem…"></textarea>
      <p>The room, game state, and recent moves will be included.</p>
      <button id="issue-submit" type="submit">File issue</button>
      <button id="issue-cancel" type="button">Close</button>
      <button id="github-logout" type="button" hidden>Log out</button>
      <p id="issue-result" role="status"></p>
    </form>
  </dialog>
</div>
</section>
