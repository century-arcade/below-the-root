[build]
command = "make build"
publish = "_build"

[functions]
directory = "functions"

[dev]
framework = "#static"
publish = "_build"
port = 8000
autoLaunch = false

[[redirects]]
from = "/about"
to = "/about.html"
status = 200

[[redirects]]
from = "/play"
to = "/play.html"
status = 200

[[redirects]]
from = "/links"
to = "/links.html"
status = 200

[[redirects]]
from = "/resources"
to = "/links"
status = 301
force = true

[[redirects]]
from = "/resources.html"
to = "/links"
status = 301
force = true
